version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pokemon_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../app:/app/app
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: pokemon_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pokemon
      POSTGRES_USER: pokemon_user
      POSTGRES_PASSWORD: pokemon_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: